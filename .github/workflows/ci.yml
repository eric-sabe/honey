name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash syntax check (parse every script)
        run: |
          set -e
          for f in *.sh lib/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck *.sh lib/*.sh
