name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: shellcheck + bash syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: bash syntax check (parse every script)
        run: |
          set -e
          for f in *.sh lib/*.sh lenses/*.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: shellcheck
        run: shellcheck *.sh lib/*.sh lenses/*.sh

  lint-powershell:
    name: PSScriptAnalyzer (Windows variant)
    runs-on: ubuntu-latest   # pwsh + PSScriptAnalyzer are cross-platform
    steps:
      - uses: actions/checkout@v4

      - name: PSScriptAnalyzer on win/
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $r = Invoke-ScriptAnalyzer -Path ./win -Recurse -Settings ./win/PSScriptAnalyzerSettings.psd1
          if ($r) { $r | Format-Table RuleName,ScriptName,Line,Message -Auto -Wrap; throw "$($r.Count) PSScriptAnalyzer finding(s)" }
          else { "PSScriptAnalyzer clean" }
